<!DOCTYPE html>
<html><head><title>Swap Rates</title><link rel="stylesheet" href="/css/admin.css"></head>
<body><div class="admin-wrapper"><aside class="admin-sidebar"></aside><div class="admin-content"><h2>Manage Swap Rates</h2><table class="admin-table"><thead><tr><th>Symbol</th><th>Long Swap</th><th>Short Swap</th><th>Action</th></tr></thead><tbody id="swapTable"></tbody></table><form id="swapForm"><input id="swapSymbol" placeholder="Symbol"><input id="swapLong" placeholder="Long rate"><input id="swapShort" placeholder="Short rate"><button type="submit">Update/Add</button></form></div></div><script>fetch('/api/swap').then(r=>r.json()).then(rates=>{document.getElementById('swapTable').innerHTML=rates.map(r=>`<tr><td>${r.symbol}</td><td><input type="number" value="${r.longRate}" class="long-${r.symbol}"></td><td><input type="number" value="${r.shortRate}" class="short-${r.symbol}"></td><td><button onclick="updateSwap('${r.symbol}')">Save</button></td></tr>`).join('');});function updateSwap(symbol){const long=document.querySelector(`.long-${symbol}`).value;const short=document.querySelector(`.short-${symbol}`).value;fetch('/api/swap',{method:'POST',headers:{'Content-Type':'application/json','admin-key':localStorage.getItem('adminKey')},body:JSON.stringify({symbol,longRate:parseFloat(long),shortRate:parseFloat(short)})});}</script></body></html>
