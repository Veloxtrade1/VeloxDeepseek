<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings | Velox</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dashboard-container">
  <aside class="sidebar">
    <div class="logo"><img src="/assets/svg/logo.svg" width="28"> Velox</div>
    <nav>
      <a href="/dashboard/overview"><i class="fas fa-tachometer-alt"></i> Overview</a>
      <a href="/dashboard/trading"><i class="fas fa-chart-line"></i> Trading</a>
      <a href="/dashboard/deposits"><i class="fas fa-arrow-down"></i> Deposit</a>
      <a href="/dashboard/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
      <a href="/dashboard/history"><i class="fas fa-history"></i> History</a>
      <a href="/dashboard/kyc"><i class="fas fa-id-card"></i> KYC</a>
      <a href="/dashboard/courses"><i class="fas fa-graduation-cap"></i> Courses</a>
      <a href="/dashboard/signals"><i class="fas fa-robot"></i> AI Signals</a>
      <a href="/dashboard/social-trading"><i class="fas fa-users"></i> Social Trading</a>
      <a href="/dashboard/alerts"><i class="fas fa-bell"></i> Alerts</a>
      <a href="/dashboard/api-keys"><i class="fas fa-key"></i> API Keys</a>
      <a href="/dashboard/swap"><i class="fas fa-exchange-alt"></i> Swap Rates</a>
      <a href="/dashboard/settings" class="active"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="top-bar-dash">
      <span id="userEmail">Loading...</span>
      <span>Balance: $<span id="balance">0</span></span>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>
    <h2>Account Settings</h2>
    <form id="profileForm">
      <label>Full Name:</label><input id="fullName" name="fullName">
      <label>Phone:</label><input id="phone" name="phone">
      <label>Address:</label><input id="address" name="address">
      <button type="submit">Update Profile</button>
    </form>
    <hr>
    <h3>Trading Mode</h3>
    <button id="switchModeBtn">Switch to Real/Demo Mode</button>
    <hr>
    <h3>Two-Factor Authentication (2FA)</h3>
    <button id="enable2fa">Enable 2FA</button>
    <div id="qrCodeContainer"></div>
    <form id="verify2faForm" style="display:none;">
      <input type="text" id="2faToken" placeholder="Enter 6-digit code">
      <button type="submit">Verify & Enable</button>
    </form>
  </main>
</div>
<script src="/js/dashboard.js"></script>
<script src="/js/twoFactor.js"></script>
</body>
</html>
