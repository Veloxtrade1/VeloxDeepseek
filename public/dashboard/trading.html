<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading | Velox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://unpkg.com/@tradingview/charting_library"></script>
</head>
<body>
<div class="dashboard-container">
  <aside class="sidebar">
    <div class="logo"><img src="/assets/svg/logo.svg" width="28"> Velox</div>
    <nav>
      <a href="/dashboard/overview"><i class="fas fa-tachometer-alt"></i> Overview</a>
      <a href="/dashboard/trading" class="active"><i class="fas fa-chart-line"></i> Trading</a>
      <a href="/dashboard/deposits"><i class="fas fa-arrow-down"></i> Deposit</a>
      <a href="/dashboard/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
      <a href="/dashboard/history"><i class="fas fa-history"></i> History</a>
      <a href="/dashboard/kyc"><i class="fas fa-id-card"></i> KYC</a>
      <a href="/dashboard/courses"><i class="fas fa-graduation-cap"></i> Courses</a>
      <a href="/dashboard/signals"><i class="fas fa-robot"></i> AI Signals</a>
      <a href="/dashboard/social-trading"><i class="fas fa-users"></i> Social Trading</a>
      <a href="/dashboard/alerts"><i class="fas fa-bell"></i> Alerts</a>
      <a href="/dashboard/api-keys"><i class="fas fa-key"></i> API Keys</a>
      <a href="/dashboard/swap"><i class="fas fa-exchange-alt"></i> Swap Rates</a>
      <a href="/dashboard/settings"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="top-bar-dash">
      <span id="userEmail">Loading...</span>
      <span>Balance: $<span id="balance">0</span></span>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>
    <div class="trading-panel">
      <div id="tradingview_chart" style="height:500px; width:100%;"></div>
      <div class="order-panel">
        <select id="symbolSelect">
          <option value="EURUSD">EUR/USD</option>
          <option value="GBPUSD">GBP/USD</option>
          <option value="XAUUSD">Gold (XAU/USD)</option>
          <option value="BTCUSD">Bitcoin</option>
          <option value="SPX500">S&P 500</option>
          <option value="NAS100">Nasdaq</option>
          <option value="UKOIL">Brent Oil</option>
          <option value="ETHUSD">Ethereum</option>
        </select>
        <input type="number" id="quantity" placeholder="Lots" step="0.01">
        <div class="trade-buttons">
          <button id="buyBtn" class="btn-primary">BUY</button>
          <button id="sellBtn" class="btn-danger">SELL</button>
        </div>
        <div id="tradeMsg"></div>
        <hr>
        <h4>Pending Orders (Limit/Stop)</h4>
        <div id="pendingOrdersList"></div>
        <form id="pendingOrderForm">
          <select id="pendingSymbol"><option>EURUSD</option></select>
          <select id="pendingSide"><option>buy</option><option>sell</option></select>
          <select id="pendingType"><option>limit</option><option>stop</option><option>stop_limit</option><option>trailing_stop</option></select>
          <input type="number" id="pendingPrice" placeholder="Price">
          <input type="number" id="pendingStopPrice" placeholder="Stop Price (if stop)">
          <input type="number" id="pendingTrailAmount" placeholder="Trail (pips)">
          <input type="number" id="pendingQuantity" placeholder="Lots">
          <button type="submit">Place Pending Order</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/trading.js"></script>
</body>
</html>
