<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Trading Signals | Velox</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dashboard-container">
  <aside class="sidebar">
    <div class="logo"><img src="/assets/svg/logo.svg" width="28"> Velox</div>
    <nav>
      <a href="/dashboard/overview"><i class="fas fa-tachometer-alt"></i> Overview</a>
      <a href="/dashboard/trading"><i class="fas fa-chart-line"></i> Trading</a>
      <a href="/dashboard/deposits"><i class="fas fa-arrow-down"></i> Deposit</a>
      <a href="/dashboard/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
      <a href="/dashboard/history"><i class="fas fa-history"></i> History</a>
      <a href="/dashboard/kyc"><i class="fas fa-id-card"></i> KYC</a>
      <a href="/dashboard/courses"><i class="fas fa-graduation-cap"></i> Courses</a>
      <a href="/dashboard/signals" class="active"><i class="fas fa-robot"></i> AI Signals</a>
      <a href="/dashboard/social-trading"><i class="fas fa-users"></i> Social Trading</a>
      <a href="/dashboard/alerts"><i class="fas fa-bell"></i> Alerts</a>
      <a href="/dashboard/api-keys"><i class="fas fa-key"></i> API Keys</a>
      <a href="/dashboard/swap"><i class="fas fa-exchange-alt"></i> Swap Rates</a>
      <a href="/dashboard/settings"><i class="fas fa-cog"></i> Settings</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="top-bar-dash">
      <span id="userEmail">Loading...</span>
      <span>Balance: $<span id="balance">0</span></span>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>
    <h2>AI-Generated Trading Signals</h2>
    <div id="signalsList"></div>
    <button id="refreshSignals">Refresh Signals</button>
  </main>
</div>
<script src="/js/dashboard.js"></script>
<script>
  async function loadSignals() {
    const res = await fetch('/api/signals');
    const signals = await res.json();
    document.getElementById('signalsList').innerHTML = signals.map(s => `
      <div class="signal-card">
        <strong>${s.symbol}</strong> - ${s.action.toUpperCase()} at ${s.entryPrice}<br>
        TP: ${s.tp1} / ${s.tp2} | SL: ${s.sl}<br>
        Confidence: ${s.confidence}%<br>
        <small>${s.reasoning}</small>
      </div>
    `).join('');
  }
  document.getElementById('refreshSignals').addEventListener('click', loadSignals);
  loadSignals();
</script>
</body>
</html>
